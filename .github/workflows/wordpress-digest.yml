name: Weekly Digest

on:
  schedule:
    # Sundays at 12:00 UTC: rounds up the week's published stories.
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
      WP_COM_ACCESS_TOKEN: ${{ secrets.WP_COM_ACCESS_TOKEN }}
      POST_STATUS: publish
      AUTO_PUBLISH_CONFIRM: I_UNDERSTAND_POSTS_GO_LIVE
      POST_BY_EMAIL_PUBLICIZE: ""
      WP_CREATE_TERMS: "true"

    steps:
      - name: Check out site automation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish the weekly digest
        shell: bash
        run: python src/weekly_digest.py
