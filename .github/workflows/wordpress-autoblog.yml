name: WordPress Auto Blog

# Schedule re-registered 2026-08-14 (cron refresh).
on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordpress-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      WP_POST_METHOD: rest
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
      WP_COM_ACCESS_TOKEN: ${{ secrets.WP_COM_ACCESS_TOKEN }}
      POST_STATUS: publish
      AUTO_PUBLISH_CONFIRM: I_UNDERSTAND_POSTS_GO_LIVE
      ARTICLE_GENERATOR: free
      HERO_IMAGE_MODE: real
      MAX_POSTS_PER_RUN: "1"
      MAX_POSTS_PER_DAY: "0"
      LOOKBACK_HOURS: "96"
      MIN_SOURCES_PER_POST: "2"
      REQUEST_TIMEOUT_SECONDS: "25"
      RUN_LOCK_STALE_SECONDS: "1800"
      TOPIC_FOCUS_KEYWORDS: health,medicine,medical,disease,clinical,treatment,patients,nutrition,fitness,mental health,wellness,science,scientists,research,researchers,breakthrough,discovery,experiment,study,physics,biology,chemistry,climate,energy,robotics,space,nasa,astronomy,planet,moon,mars,telescope,galaxy,phone,phones,iphone,ios,android,apple,samsung,pixel,gadget,gadgets,ai,artificial intelligence,software,apps,app,innovation
      CATEGORY_ROTATION: science,space,ai,gadgets,phones,android,apple,software,security,tutorials,hacks,health
      CATEGORY_WEIGHTS: science=6,space=6,ai=6,gadgets=6,security=6,tutorials=6,hacks=6,phones=6,apple=6,android=6,software=6,health=6,tech=4
      RECENT_CATEGORY_WINDOW: "8"
      RECENT_CATEGORY_PENALTY: "4"
      ALLOW_SINGLE_SOURCE_PRIORITY_POSTS: "true"
      SINGLE_SOURCE_PRIORITY_CATEGORIES: science,space
      SINGLE_SOURCE_MIN_QUALITY: "4"
      WP_CREATE_TERMS: "true"
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
      X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
      X_TOKEN_EXPIRES_AT: ${{ secrets.X_TOKEN_EXPIRES_AT }}
      X_SHARE_MAX_PER_RUN: "2"
      X_SHARE_BACKFILL: "false"
      X_SHARE_TITLE_ONLY: "true"
      X_SHARE_STATE_PATH: data/x_shared_posts.json
      BLOG_FEED_URL: https://chuckyscarnage.tech.blog/feed/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore latest automation state
        run: |
          git fetch origin "${GITHUB_REF##*/}"
          git checkout origin/"${GITHUB_REF##*/}" -- data/autoblog.sqlite3 data/x_shared_posts.json 2>/dev/null || true
      - name: Publish one post
        run: python src/wp_auto_blog.py run
      - name: Share the new post to X
        continue-on-error: true
        run: python src/share_blog_to_x.py
      - name: Save automation state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/autoblog.sqlite3 data/x_shared_posts.json data/last_run_status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update WordPress auto-blog state"
            git pull --rebase origin "${GITHUB_REF##*/}"
            git push origin HEAD:"${GITHUB_REF##*/}"
          fi
